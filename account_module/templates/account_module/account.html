{% extends "base.html" %}
{% load static %}

{% block header_references %}
    <link rel="stylesheet" href="{% static 'account_module/css/account.css' %}">
{% endblock header_references %}

{% block content %}

    {% for reservation in reservations %}

        <div class="glass">

            <div class="date-box">
                {{ reservation.date }}
            </div>

            <div class="time-box">
                {{ reservation.time }}
            </div>

        </div>

    {% empty %}

        <p>هنوز هیچ رزروی ندارید.</p>

    {% endfor %}



    <div class='nav-box flex-center'>
        <i class='icon fa-solid fa-door fa-9x'></i>
        <a class='nav-item' href='{% url "logout-page" %}'>خروج از حساب</a>
    </div>

{% endblock content %}
